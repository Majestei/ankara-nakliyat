<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ozdemirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="ozdemirBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gold Accent -->
    <linearGradient id="ozdemirGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="ozdemirGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for 3D depth -->
    <filter id="ozdemirShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Main Squircle Badge with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#ozdemirBg)" stroke="url(#ozdemirBorder)" stroke-width="6" filter="url(#ozdemirShadow)"/>

  <!-- Subtle Top Gloss Curve -->
  <path d="M 30 130 C 30 75, 75 30, 130 30 L 382 30 C 437 30, 482 75, 482 130 C 482 170, 310 230, 30 190 Z" fill="url(#ozdemirGloss)"/>

  <!-- Two Dots for "Ö" (Turkish Umlaut) -->
  <circle cx="218" cy="90" r="18" fill="#ffffff" filter="url(#ozdemirShadow)"/>
  <circle cx="294" cy="90" r="18" fill="#ffffff" filter="url(#ozdemirShadow)"/>

  <!-- House Roof (Home Moving Symbolism) -->
  <path d="M 108 220 L 256 112 L 404 220 L 376 220 L 256 133 L 136 220 Z" fill="#ffffff"/>

  <!-- Motion Speed Lines (Left) -->
  <path d="M 68 262 L 112 262" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 52 288 L 104 288" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 72 314 L 112 314" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Truck Cargo Box -->
  <rect x="136" y="215" width="160" height="135" rx="14" fill="#ffffff"/>

  <!-- Moving Fast Arrows inside Cargo Box -->
  <path d="M 175 255 L 208 282 L 175 310" stroke="#ea580c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 215 255 L 248 282 L 215 310" stroke="#f97316" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Truck Cabin -->
  <path d="M 304 246 L 344 246 Q 378 246 384 278 L 391 316 Q 394 350 364 350 L 304 350 Z" fill="#ffffff"/>

  <!-- Cabin Window (Dark Windshield) -->
  <path d="M 314 258 L 346 258 Q 364 258 368 276 L 373 302 L 314 302 Z" fill="#0f172a"/>

  <!-- Headlight (Gold Glow) -->
  <rect x="382" y="318" width="10" height="18" rx="4" fill="url(#ozdemirGold)"/>

  <!-- Chassis / Bumper Bar -->
  <rect x="122" y="344" width="276" height="12" rx="6" fill="#0f172a"/>

  <!-- Rear Wheel -->
  <circle cx="184" cy="362" r="30" fill="#0f172a"/>
  <circle cx="184" cy="362" r="16" fill="#e2e8f0"/>
  <circle cx="184" cy="362" r="7" fill="#ea580c"/>

  <!-- Front Wheel -->
  <circle cx="344" cy="362" r="30" fill="#0f172a"/>
  <circle cx="344" cy="362" r="16" fill="#e2e8f0"/>
  <circle cx="344" cy="362" r="7" fill="#ea580c"/>

  <!-- Dynamic Road / Speed Lines Underneath -->
  <path d="M 76 414 L 436 414" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
  <path d="M 126 438 L 386 438" stroke="#ffedd5" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
</svg>